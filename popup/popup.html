<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MakiNuki Companion</title>
<style>
  body {
    font: 13px/1.5 system-ui, sans-serif;
    width: 240px;
    margin: 0;
    padding: 12px;
    background: #101014;
    color: #e8e8ee;
  }
  h1 { font-size: 14px; margin: 0 0 6px; }
  p { margin: 4px 0; color: #9a9aa8; }
  #status { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: #1e1e26; }
  button {
    margin-top: 10px; width: 100%;
    background: #7c6cff; color: #fff; border: none;
    border-radius: 6px; padding: 7px 0; cursor: pointer; font-size: 13px;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<h1>MakiNuki Companion</h1>
<p>Zero-CORS fetch bridge for MakiNuki web sources.</p>
<div id="status">checking permission...</div>
<button id="connect" disabled>Connect (grant host access)</button>
<script src="popup.js"></script>
</body>
</html>
